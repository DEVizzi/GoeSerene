name: Auto NatGeo Reel Bot

on:
  schedule:
    # Monday to Sunday — 9:30 AM IST and 7:00 PM IST
    - cron: "0 4 * * 1"   # 9:30 AM IST Monday
    - cron: "30 13 * * 1" # 7:00 PM IST Monday

    - cron: "0 4 * * 2"   # 9:30 AM IST Tuesday
    - cron: "30 13 * * 2" # 7:00 PM IST Tuesday

    - cron: "0 4 * * 3"   # 9:30 AM IST Wednesday
    - cron: "30 13 * * 3" # 7:00 PM IST Wednesday

    - cron: "0 4 * * 4"   # 9:30 AM IST Thursday
    - cron: "30 13 * * 4" # 7:00 PM IST Thursday

    - cron: "0 4 * * 5"   # 9:30 AM IST Friday
    - cron: "30 13 * * 5" # 7:00 PM IST Friday

    - cron: "0 4 * * 6"   # 9:30 AM IST Saturday
    - cron: "30 13 * * 6" # 7:00 PM IST Saturday

    - cron: "0 4 * * 0"   # 9:30 AM IST Sunday
    - cron: "30 13 * * 0" # 7:00 PM IST Sunday

  workflow_dispatch:

permissions:
  contents: write

jobs:
  poetrybot:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_USER_TOKEN: ${{ secrets.IG_USER_TOKEN }}
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
      TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
      TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
      TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
      TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COVERR_API_URL: ${{ secrets.COVERR_API_URL }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run the NatGeo cinematic bot
        run: python natGeo_bot.py

      - name: Commit updated history file (if any)
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add history.txt
          git diff --cached --quiet || (git commit -m "🤖 Update history after auto-post" && git push)

