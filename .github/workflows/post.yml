name: Auto NatGeo Reel Bot

on:
  schedule:
    # MONDAY (targeting US mornings, Europe midday, Asia evenings)
    - cron: "13 11 * * 1"  # 11:13 AM UTC = 4:43 PM IST = 7:13 AM EST
    - cron: "17 14 * * 1"  # 2:17 PM UTC = 7:47 PM IST = 9:17 AM EST
    - cron: "22 17 * * 1"  # 5:22 PM UTC = 10:52 PM IST = 12:22 PM EST

    # TUESDAY (targeting Asia mornings, Europe afternoons, US evenings)
    - cron: "1 2 * * 2"    # 2:01 AM UTC = 7:31 AM IST = 9:01 PM EST (prev day)
    - cron: "10 9 * * 2"   # 9:10 AM UTC = 2:40 PM IST = 5:10 AM EST
    - cron: "18 14 * * 2"  # 2:18 PM UTC = 7:48 PM IST = 9:18 AM EST

    # WEDNESDAY
    - cron: "3 3 * * 3"    # 3:03 AM UTC = 8:33 AM IST = 10:03 PM EST (prev day)
    - cron: "11 10 * * 3"  # 10:11 AM UTC = 3:41 PM IST = 6:11 AM EST
    - cron: "19 15 * * 3"  # 3:19 PM UTC = 8:49 PM IST = 11:19 AM EST

    # THURSDAY
    - cron: "2 4 * * 4"    # 4:02 AM UTC = 9:32 AM IST = 11:02 PM EST (prev day)
    - cron: "12 11 * * 4"  # 11:12 AM UTC = 4:42 PM IST = 7:12 AM EST
    - cron: "20 16 * * 4"  # 4:20 PM UTC = 9:50 PM IST = 12:20 PM EST

    # FRIDAY
    - cron: "5 5 * * 5"    # 5:05 AM UTC = 10:35 AM IST = 12:05 AM EST
    - cron: "13 12 * * 5"  # 12:13 PM UTC = 5:43 PM IST = 8:13 AM EST
    - cron: "21 17 * * 5"  # 5:21 PM UTC = 10:51 PM IST = 1:21 PM EST

    # SATURDAY (heavier US time focus)
    - cron: "14 13 * * 6"  # 1:14 PM UTC = 6:44 PM IST = 9:14 AM EST
    - cron: "17 16 * * 6"  # 4:17 PM UTC = 9:47 PM IST = 12:17 PM EST
    - cron: "22 20 * * 6"  # 8:22 PM UTC = 1:52 AM IST (Sun) = 4:22 PM EST

    # SUNDAY (emotional high-engagement content)
    - cron: "8 6 * * 0"    # 6:08 AM UTC = 11:38 AM IST = 1:08 AM EST
    - cron: "14 13 * * 0"  # 1:14 PM UTC = 6:44 PM IST = 9:14 AM EST
    - cron: "20 18 * * 0"  # 6:20 PM UTC = 11:50 PM IST = 2:20 PM EST

  workflow_dispatch:

jobs:
  poetrybot:
    runs-on: ubuntu-latest
    
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
      TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
      TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
      TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
      TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COVERR_API_URL: ${{ secrets.COVERR_API_URL }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS: myvoiceoverbot-a0da14b71e20.json
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
  
      - name: Run the NatGeo cinematic bot
        run: python natGeo_bot.py
  
      - name: Commit updated history file (if any)
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add history.txt
          git diff --cached --quiet || git commit 
