name: Automated Instagram Plant Post

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Cache Instagram Session
        id: cache-session
        uses: actions/cache@v4
        with:
          path: ig_session.pkl
          key: ig-session-${{ env.INSTAGRAM_USERNAME }}
          restore-keys: |
            ig-session-${{ env.INSTAGRAM_USERNAME }}-
      # :contentReference[oaicite:3]{index=3} :contentReference[oaicite:4]{index=4}.

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automation Script
        env:
          INSTAGRAM_USERNAME: ${{ secrets.INSTAGRAM_USERNAME }}
          INSTAGRAM_PASSWORD: ${{ secrets.INSTAGRAM_PASSWORD }}
          INSTAGRAM_SESSION_FILE: ig_session.pkl
        run: python main.py

      - name: Save Instagram Session
        if: steps.cache-session.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ig_session.pkl
          key: ig-session-${{ env.INSTAGRAM_USERNAME }}
      # :contentReference[oaicite:5]{index=5}.
