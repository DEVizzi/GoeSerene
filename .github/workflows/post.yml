name: Auto NatGeo Reel Bot

on:
  schedule:
    # MONDAY (targeting US mornings, Europe midday, Asia evenings)
    # - cron: "30 1 * * 1"  # 7:00 AM IST
# - cron: "30 7 * * 1"  # 1:00 PM IST
# - cron: "30 14 * * 1" # 8:00 PM IST

# Tuesday
# - cron: "30 2 * * 2"  # 8:00 AM IST
# - cron: "30 8 * * 2"  # 2:00 PM IST
# - cron: "30 15 * * 2" # 9:00 PM IST

# Wednesday
# - cron: "30 1 * * 3"  # 7:00 AM IST
# - cron: "30 7 * * 3"  # 1:00 PM IST
# - cron: "30 14 * * 3" # 8:00 PM IST

# Thursday
# - cron: "30 2 * * 4"  # 8:00 AM IST
# - cron: "30 8 * * 4"  # 2:00 PM IST
# - cron: "30 15 * * 4" # 9:00 PM IST

# Friday
# - cron: "30 1 * * 5"  # 7:00 AM IST
# - cron: "30 7 * * 5"  # 1:00 PM IST
# - cron: "30 14 * * 5" # 8:00 PM IST

# Saturday
# - cron: "30 3 * * 6"  # 9:00 AM IST
# - cron: "30 9 * * 6"  # 3:00 PM IST
# - cron: "30 16 * * 6" # 10:00 PM IST

# Sunday
# - cron: "30 2 * * 0"  # 8:00 AM IST
# - cron: "30 8 * * 0"  # 2:00 PM IST
# - cron: "30 15 * * 0" # 9:00 PM IST

  workflow_dispatch:

jobs:
  poetrybot:
    runs-on: ubuntu-latest
    
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
      TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
      TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
      TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
      TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COVERR_API_URL: ${{ secrets.COVERR_API_URL }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      GOOGLE_APPLICATION_CREDENTIALS: myvoiceoverbot-a0da14b71e20.json
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
  
      - name: Run the NatGeo cinematic bot
        run: python natGeo_bot.py
  
      - name: Commit updated history file (if any)
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add history.txt
          git diff --cached --quiet || git commit -m "🤖 Update history after auto-post"
