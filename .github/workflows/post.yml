name: Auto NatGeo Reel & YouTube Documentary Bot

on:
  schedule:
    # Strictly ONCE per day at peak global engagement overlap (avoids :00/:30 GitHub cron queue delays):
    # 13:17 UTC -> publishes ~13:22-13:30 UTC = 7:00 PM IST (India evening peak) / 9:30 AM EDT / 2:30 PM BST
    # Enforces strictly 1 video/day on Instagram (@geoserene) and 1 video/day on YouTube (@GeoSerene).
    - cron: "17 13 * * *"

  workflow_dispatch:
    inputs:
      mode:
        description: "Publish mode (auto = 1 daily video on IG + 1 on YT; reel = IG+YT Reel; long = >8m YT horizontal)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - reel
          - long
          - dry-run
      force:
        description: "Bypass the 1-video-per-day channel guard (use only for explicit manual tests)"
        required: false
        default: false
        type: boolean
      force_long:
        description: "Force a >8-minute horizontal YouTube documentary upload on this run"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: geoserene-autopost
  cancel-in-progress: false

jobs:
  poetrybot:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_USER_TOKEN: ${{ secrets.IG_USER_TOKEN }}
      FB_APP_ID: ${{ secrets.FB_APP_ID }}
      FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
      TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
      TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
      TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
      TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
      TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COVERR_API_URL: ${{ secrets.COVERR_API_URL }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run unit tests
        run: python -m unittest -v test_natgeo_bot.py

      - name: Run GeoSerene Dual-Platform Reels + Long-Form YouTube Engine
        id: run_bot
        env:
          INPUT_MODE: ${{ github.event.inputs.mode || 'auto' }}
          INPUT_FORCE: ${{ github.event.inputs.force || 'false' }}
          INPUT_FORCE_LONG: ${{ github.event.inputs.force_long || 'false' }}
        run: |
          EXTRA_ARGS=()
          if [ "$INPUT_FORCE" = "true" ]; then
            EXTRA_ARGS+=(--force)
          fi
          if [ "$INPUT_FORCE_LONG" = "true" ]; then
            EXTRA_ARGS+=(--force-long)
          fi
          python natGeo_bot.py --mode "$INPUT_MODE" "${EXTRA_ARGS[@]}"

      - name: Commit updated history & publish state (always, even on partial platform failure)
        if: always()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          touch history.txt long_video_history.txt publish_state.json
          git add history.txt long_video_history.txt publish_state.json
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Update history & publish state after auto-post [skip ci]"
            git pull --rebase origin main
            git push
          fi
